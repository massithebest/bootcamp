<!doctype html>
<html lang="ko">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Workbench UX regression</title>
<body><pre id="results">검증 중…</pre>
<script type="module">
import { runWorkbenchRegressions } from './workbench-browser.tsx';
try {
  const results = await runWorkbenchRegressions();
  document.querySelector('#results').textContent = JSON.stringify(results, null, 2);
  document.title = results.some(r => r.error) ? 'FAIL' : 'PASS';
} catch (error) { document.querySelector('#results').textContent = String(error); document.title = 'FAIL'; }
</script>
</body></html>
