<!doctype html>
<html lang="ko">
  <meta charset="utf-8" />
  <title>Chat lifecycle regression</title>
  <body>
    <pre id="results">검증 중…</pre>
    <script type="module">
      import { runChatRegressions, runExecutionUiRegressions } from "./chat-browser.tsx";
      const results = [
        ...await runChatRegressions(),
        ...await runExecutionUiRegressions(),
      ];
      document.querySelector("#results").textContent = JSON.stringify(results, null, 2);
      document.title = results.some(result => result.error) ? "FAIL" : "PASS";
    </script>
  </body>
</html>
