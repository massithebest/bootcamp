[pytest]
testpaths = tests
markers =
    e2e: 실제 Agent(LLM)를 호출하는 시나리오 테스트. `pytest -m e2e` 로만 실행한다.
    smt2020: 로컬 SMT2020 원본과 변환 스크립트가 있을 때만 실행하는 개발 회귀 테스트.
    mock_service: 개발용 mock service 동작을 직접 검증하는 테스트.
    smt2020_bundle: 번들 SMT2020 지식 YAML의 고정 값(wip, initial_wip 등)을 단정하는 개발 회귀 테스트.
addopts = -m "not e2e"
