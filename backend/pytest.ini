[pytest]
testpaths = tests
markers =
    e2e: 실제 Agent(LLM)를 호출하는 시나리오 테스트. `pytest -m e2e` 로만 실행한다.
    mock_service: 합성 mock DB 생성기(`scripts/generate_mock_database.py`)를 사용하는 개발용 mock service 회귀 테스트.
    bundled_knowledge: 번들 knowledge YAML의 고정 값(wip, initial_wip 등)을 단정하는 개발 회귀 테스트.
addopts = -m "not e2e"
