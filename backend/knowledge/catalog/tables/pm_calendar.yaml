table: pm_calendar
description: SMT2020 설비 예방보전 주기와 정비 시간 조건
grain: [dataset, pmcalname]
tags: [SMT2020, 설비, 예방보전, PM, Calendar]
columns:
  - {name: dataset, type: varchar, desc: "benchmark 구분 (HVLM 또는 LVHM)"}
  - {name: pmcalname, type: varchar, desc: PM calendar 이름}
  - {name: pmcaltype, type: varchar, desc: PM calendar 유형}
  - {name: mtbpm, type: int, desc: 예방보전 간 평균 주기}
  - {name: mtbpmunits, type: varchar, desc: 예방보전 주기 단위}
  - {name: mttrdist, type: varchar, desc: 정비 시간 분포}
  - {name: mttr, type: number, desc: 정비 시간 기준값}
  - {name: mttr2, type: number, desc: 정비 시간 두 번째 분포 파라미터}
  - {name: mttrunits, type: varchar, desc: 정비 시간 단위}
  - {name: ignore_value, type: varchar, desc: 원본 IGNORE 분류 값}
joins: []
caveats:
  - calendar_attach.calname과 연결할 때 caltype이 pm인지 함께 확인한다
query_rules:
  - 특정 benchmark 질문은 dataset을 필수로 제한한다
  - 예방보전 주기나 정비 시간을 비교할 때 분포와 단위 컬럼을 함께 조회한다
aggregation_rules:
  - mtbpm과 mttr은 각각의 분포와 단위를 포함해 해석한다
visualization_hints:
  - 같은 단위의 calendar별 mtbpm 또는 mttr 비교에는 bar 차트가 적합하다
  - mtbpm과 mttr은 의미가 다르므로 같은 수량 계열처럼 누적하지 않는다
sample_queries:
  - question: benchmark별 예방보전 캘린더는 몇 개야?
    sql: |
      SELECT dataset, COUNT(*) AS calendar_count
      FROM pm_calendar
      GROUP BY dataset
      ORDER BY dataset
status: verified
