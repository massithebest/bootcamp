table: setup_group
description: SMT2020 setup group별 setup 상태와 최소 run 조건
grain: [dataset, setup]
tags: [SMT2020, Setup, Group]
columns:
  - {name: dataset, type: varchar, desc: "benchmark 구분 (HVLM 또는 LVHM)"}
  - {name: setupgrp, type: varchar, desc: Setup group}
  - {name: setup, type: varchar, desc: Setup 상태}
  - {name: minrun, type: int, desc: 최소 run 값}
  - {name: ignore_value, type: varchar, desc: 원본 IGNORE 분류 값}
joins:
  - {to: tool, on: [dataset, setupgrp], kind: one-to-many}
caveats:
  - 빈 setupgrp은 NULL로 보존하며 이전 행의 group을 채우지 않는다
aggregation_rules:
  - setup 상태 수는 dataset과 setup 기준으로 센다
sample_sql: SELECT dataset, setupgrp, setup, minrun FROM setup_group ORDER BY dataset, ignore_value, setup
status: verified
owner: ""
updated: 2026-09-15
source: SMT2020 setupgrp.txt 직접 확인
