scenario_id: hvlm_input_integrity
name: SMT2020 HVLM 초기 WIP·Route 입력 검증
description: HVLM의 초기 WIP 집계, Part별 Route 연결과 simulation 입력 정합성을 함께 확인한다.
dataset: HVLM
question: HVLM의 제품별 초기 WIP와 공정 Step 수를 조회하고 입력 관계가 완전한지 확인해줘.
steps:
  - action: recipe
    ref: initial_wip_by_part
    params: {dataset: HVLM}
    expectation: 2개 Part의 합계가 2255 Lot, 56375 pieces다.
  - action: recipe
    ref: part_route_tool_summary
    params: {dataset: HVLM}
    expectation: 2개 Part와 926개 Route Step이 조회되고 설비 Family 연결 차이가 없다.
  - action: recipe
    ref: wip_integrity_diagnostics
    params: {dataset: HVLM}
    expectation: 세 연결 누락 지표가 0이고 dataset 생략 및 Route 조인 위험을 원본 오류와 구분한다.
  - action: simulation
    ref: SMT2020_입력검증
    params: {dataset: HVLM}
    expectation: 다섯 핵심 관계의 unmatched_rows가 모두 0이다.
expected:
  table_counts:
    part: 2
    route_step: 926
    tool: 106
    orders: 5
    wip: 2255
    setup: 13
    setup_group: 9
    down_calendar: 11
    pm_calendar: 292
    calendar_attach: 303
    transport: 1
  unmatched_rows:
    part_to_route_step: 0
    route_step_to_tool: 0
    wip_to_part: 0
    orders_to_part: 0
    wip_curstep_to_route_step: 0
status: draft
owner: ""
updated: 2026-09-15
source: SMT2020 HVLM 원본과 생성 SQLite의 고정 인수 기준
