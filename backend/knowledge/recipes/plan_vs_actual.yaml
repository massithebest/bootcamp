recipe_id: plan_vs_actual
name: 계획 대비 실적
description: >
  FGS_INBOUND_RESULT 와 PRODUCTION_PLAN 을 work_date/line_cd/product_id 로 조인해
  라인·일자별 실적/계획/달성률을 집계하는 CTE. fgs_inbound KPI 의 sql_template 과
  동일한 조인·필터 로직을 재사용 가능한 형태로 뺀 것이다.
cte_name: plan_vs_actual
cte_sql: |
  SELECT r.work_date, r.line_cd,
         SUM(r.inbound_qty) AS actual,
         SUM(p.plan_qty) AS plan,
         ROUND(1.0 * SUM(r.inbound_qty) / NULLIF(SUM(p.plan_qty), 0), 3) AS rate
  FROM FGS_INBOUND_RESULT r
  JOIN PRODUCTION_PLAN p
    ON p.work_date = r.work_date AND p.line_cd = r.line_cd AND p.product_id = r.product_id
  WHERE r.status_cd <> 'X'
  GROUP BY r.work_date, r.line_cd
sources: [FGS_INBOUND_RESULT, PRODUCTION_PLAN]
sample_queries:
  - description: 라인별 누적 달성률 (전체 기간)
    sql: |
      WITH plan_vs_actual AS (
        SELECT r.work_date, r.line_cd,
               SUM(r.inbound_qty) AS actual,
               SUM(p.plan_qty) AS plan,
               ROUND(1.0 * SUM(r.inbound_qty) / NULLIF(SUM(p.plan_qty), 0), 3) AS rate
        FROM FGS_INBOUND_RESULT r
        JOIN PRODUCTION_PLAN p
          ON p.work_date = r.work_date AND p.line_cd = r.line_cd AND p.product_id = r.product_id
        WHERE r.status_cd <> 'X'
        GROUP BY r.work_date, r.line_cd
      )
      SELECT line_cd, SUM(actual) AS actual, SUM(plan) AS plan,
             ROUND(1.0 * SUM(actual) / NULLIF(SUM(plan), 0), 3) AS rate
      FROM plan_vs_actual
      GROUP BY line_cd
      ORDER BY line_cd
  - description: 특정 기간 부진 라인 찾기 (달성률 0.9 미만)
    sql: |
      WITH plan_vs_actual AS (
        SELECT r.work_date, r.line_cd,
               SUM(r.inbound_qty) AS actual,
               SUM(p.plan_qty) AS plan,
               ROUND(1.0 * SUM(r.inbound_qty) / NULLIF(SUM(p.plan_qty), 0), 3) AS rate
        FROM FGS_INBOUND_RESULT r
        JOIN PRODUCTION_PLAN p
          ON p.work_date = r.work_date AND p.line_cd = r.line_cd AND p.product_id = r.product_id
        WHERE r.status_cd <> 'X'
        GROUP BY r.work_date, r.line_cd
      )
      SELECT work_date, line_cd, actual, plan, rate
      FROM plan_vs_actual
      WHERE work_date BETWEEN '2026-09-15' AND '2026-09-21' AND rate < 0.9
      ORDER BY work_date, line_cd
