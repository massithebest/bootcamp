recipe_id: wip_integrity_diagnostics
name: WIP 연결·집계 위험 진단
description: dataset별 입력 연결 누락과 조인 시 WIP 중복 합산 위험을 확인한다.
cte_name: wip_integrity_diagnostics
cte_sql: |
  SELECT w.dataset,
         COUNT(*) AS wip_lot_count,
         SUM(w.pieces) AS wip_piece_count,
         SUM(CASE WHEN NOT EXISTS (
           SELECT 1 FROM part p WHERE p.dataset = w.dataset AND p.part = w.part
         ) THEN 1 ELSE 0 END) AS wip_missing_part,
         SUM(CASE WHEN NOT EXISTS (
           SELECT 1 FROM part p JOIN route_step r
             ON r.dataset = p.dataset AND r.route = p.route
           WHERE p.dataset = w.dataset AND p.part = w.part AND r.step = w.curstep
         ) THEN 1 ELSE 0 END) AS wip_missing_step,
         (SELECT COUNT(*) FROM route_step r WHERE r.dataset = w.dataset
           AND NOT EXISTS (SELECT 1 FROM tool t WHERE t.dataset = r.dataset AND t.stnfam = r.stnfam)
         ) AS route_missing_tool,
         (SELECT COUNT(*) FROM wip x JOIN part p ON p.part = x.part
           WHERE x.dataset = w.dataset AND p.dataset <> x.dataset
         ) AS cross_dataset_part_matches,
         (SELECT COUNT(*) FROM wip x JOIN part p ON p.dataset = x.dataset AND p.part = x.part
           JOIN route_step r ON r.dataset = p.dataset AND r.route = p.route
           WHERE x.dataset = w.dataset
         ) AS route_join_rows
    FROM wip w
   GROUP BY w.dataset
sources: [wip, part, route_step, tool]
when_to_use:
  - 초기 WIP 집계가 예상과 다르거나 입력 연결 누락을 확인할 때
output_grain: [dataset]
output_columns:
  - {name: dataset, role: category, desc: 데이터셋}
  - {name: wip_lot_count, role: measure, unit: lot, desc: 원본 WIP Lot 수}
  - {name: wip_piece_count, role: measure, unit: piece, desc: 원본 WIP 수량}
  - {name: wip_missing_part, role: measure, unit: row, desc: Part가 없는 WIP 행 수}
  - {name: wip_missing_step, role: measure, unit: row, desc: 현재 Step을 연결할 수 없는 WIP 행 수}
  - {name: route_missing_tool, role: measure, unit: row, desc: 설비 Family가 없는 Route Step 수}
  - {name: cross_dataset_part_matches, role: measure, unit: row, desc: dataset 키 생략 시 다른 dataset으로 잘못 연결되는 후보 수}
  - {name: route_join_rows, role: measure, unit: row, desc: 모든 Route Step 조인 시 행 수}
query_rules:
  - 진단 대상 benchmark의 dataset을 바깥 SELECT에서 필수로 제한한다
  - 결과가 0인 누락 지표도 생략하지 않고 함께 조회한다
  - 이 레시피 결과를 실제 생산실적이나 납기 성과로 해석하지 않는다
aggregation_rules:
  - 연결 누락 세 지표는 0이 기대값이며 같은 WIP 행이 여러 검사에 포함될 수 있어 합산하지 않는다.
  - cross_dataset_part_matches는 잘못된 조인의 위험이며 원본 데이터 오류나 생산 부진의 증거가 아니다.
  - route_join_rows가 wip_lot_count보다 크면 Step 조인 후 SUM(pieces)가 과대 계산될 수 있다.
  - WIP 수량은 원본에서 dataset과 part별로 먼저 집계하고 Route 요약과 같은 grain으로 연결한다.
  - 이 결과는 입력·집계 검증이며 실제 납기 지연이나 생산 부진 원인을 입증하지 않는다.
visualization_hints: []
sample_queries:
  - question: LVHM WIP 입력 연결과 Route 조인 중복 위험은 어때?
    sql: SELECT * FROM wip_integrity_diagnostics WHERE dataset = 'LVHM'
  - question: HVLM WIP 입력 연결과 Route 조인 중복 위험은 어때?
    sql: SELECT * FROM wip_integrity_diagnostics WHERE dataset = 'HVLM'
