table: transport
description: 위치 간 운반 시간 분포
grain: [dataset, fromloc, toloc]
tags: [물류, 이동시간, Location]
columns:
  - {name: dataset, type: varchar, desc: "생산 세그먼트 구분 (SEG_A 또는 SEG_B)"}
  - {name: fromloc, type: varchar, desc: 출발 위치}
  - {name: toloc, type: varchar, desc: 도착 위치}
  - {name: ddist, type: varchar, desc: 이동시간 분포}
  - {name: dtime, type: number, desc: 이동시간 기준값}
  - {name: dtime2, type: number, desc: 이동시간 두 번째 분포 파라미터}
  - {name: dunits, type: varchar, desc: 이동시간 단위}
joins: []
caveats:
  - dtime/dtime2는 ddist와 dunits를 포함해 해석한다
query_rules:
  - 특정 세그먼트 질문은 dataset을 필수로 제한한다
  - 운반시간을 조회할 때 fromloc, toloc, ddist, dunits를 함께 조회한다
aggregation_rules:
  - 이동시간은 dataset과 위치 쌍별 분포 파라미터이며 단순 실적 합계가 아니다
visualization_hints:
  - 같은 분포·단위의 위치 쌍별 dtime 비교에는 bar 차트가 적합하다
  - 분포 파라미터 전체 설명은 차트보다 표가 적합하다
sample_queries:
  - question: 세그먼트의 Fab 내부 운반시간 분포는 어떻게 정의돼 있어?
    sql: |
      SELECT dataset, fromloc, toloc, ddist, dtime, dtime2, dunits
      FROM transport
      ORDER BY dataset, fromloc, toloc
active: true
status: verified
owner: ""
