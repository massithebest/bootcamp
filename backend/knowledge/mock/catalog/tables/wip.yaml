table: wip
description: simulation 시작 시점의 초기 재공 Lot
grain: [dataset, lot]
time_column: due
tags: [WIP, 재공, Lot, 납기]
columns:
  - {name: dataset, type: varchar, desc: "생산 세그먼트 구분 (SEG_A 또는 SEG_B)"}
  - {name: lot, type: varchar, desc: Lot ID}
  - {name: part, type: varchar, desc: Part ID, ref: part.part}
  - {name: prior, type: int, desc: Priority}
  - {name: pieces, type: int, desc: Lot 수량}
  - {name: start, type: datetime, desc: 원본 시작 시각}
  - {name: curstep, type: int, desc: 현재 Route Step}
  - {name: due, type: datetime, desc: 납기 시각}
  - {name: order_id, type: varchar, desc: Order ID}
  - {name: hotlot, type: varchar, desc: Hot lot 표시}
  - {name: trace, type: varchar, desc: Trace 표시}
joins:
  - {to: part, on: [dataset, part], kind: many-to-one}
caveats:
  - SEG_A와 SEG_B의 같은 part ID는 서로 다른 제품이므로 같은 part끼리 짝지어 WIP를 비교하지 않고, 세그먼트 비교는 세그먼트 단위 집계로 한다
  - curstep은 part의 route를 거쳐 route_step과 연결한다
  - 빈 hotlot/trace는 NULL이며 일반 Lot 여부를 별도 값으로 보정하지 않는다
query_rules:
  - 특정 세그먼트 질문은 dataset을 필수로 제한하고 SEG_A/SEG_B 비교일 때만 두 dataset을 함께 조회한다
  - part 또는 route_step과 조인할 때 dataset과 업무 키를 모두 조인 조건에 포함한다
  - 납기 기간 요청은 due를 사용하고 start를 실제 투입 시각으로 단정하지 않는다
aggregation_rules:
  - 초기 WIP Lot 수는 dataset과 part별 COUNT(*)로 센다
  - 초기 WIP piece 수는 dataset과 part별 SUM(pieces)로 센다
visualization_hints:
  - part별 lot_count 또는 piece_count 비교에는 bar 차트가 적합하다
  - due 기준 추이는 시간 grain으로 다시 집계한 뒤 line 차트로 표현한다
sample_queries:
  - question: 세그먼트별 초기 WIP Lot과 piece 합계는 얼마야?
    sql: |
      SELECT dataset, COUNT(*) AS lot_count, SUM(pieces) AS piece_count
      FROM wip
      GROUP BY dataset
      ORDER BY dataset
