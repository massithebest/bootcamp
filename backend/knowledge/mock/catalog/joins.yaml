- name: Part의 Route Step
  from: part
  to: route_step
  on: [dataset, route]
  kind: left
  note: dataset이 빠지면 SEG_A/SEG_B의 동일 route가 교차 조인된다
- name: Route Step의 설비 Family
  from: route_step
  to: tool
  on: [dataset, stnfam]
  kind: left
- name: Part의 초기 WIP
  from: part
  to: wip
  on: [dataset, part]
  kind: left
- name: Part의 신규 투입 Order
  from: part
  to: orders
  on: [dataset, part]
  kind: left
